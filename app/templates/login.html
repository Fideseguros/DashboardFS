<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fide. Seguros &mdash; Iniciar Sesi&oacute;n</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,800&display=swap" rel="stylesheet">
<style>
:root {
  --fide-teal: #00a79d;
  --fide-teal-dark: #008f87;
  --fide-mint: #85ffaa;
  --fide-mint-light: #dbffe6;
  --fide-black: #1a1a1a;
  --fide-gray: #e6e7e8;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--fide-teal) 0%, var(--fide-teal-dark) 50%, #007a73 100%);
  position: relative;
  overflow: hidden;
}
body::before {
  content: '';
  position: absolute;
  top: -20%;
  right: -15%;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(133,255,170,0.15) 0%, transparent 70%);
  border-radius: 50%;
}
body::after {
  content: '';
  position: absolute;
  bottom: -30%;
  left: -10%;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(133,255,170,0.1) 0%, transparent 70%);
  border-radius: 50%;
}
.login-card {
  background: white;
  border-radius: 20px;
  padding: 3rem 2.5rem;
  width: 400px;
  max-width: 90vw;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  z-index: 1;
  text-align: center;
}
.logo-area {
  margin-bottom: 2rem;
}
.logo-area svg { height: 56px; }
.logo-area .subtitle {
  font-size: 0.85rem;
  color: #5a6a6e;
  font-weight: 600;
  margin-top: 0.5rem;
}
.form-group {
  margin-bottom: 1.2rem;
  text-align: left;
}
.form-group label {
  display: block;
  font-size: 0.75rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--fide-teal);
  margin-bottom: 0.35rem;
}
.form-group input {
  width: 100%;
  padding: 0.75rem 1rem;
  border: 2px solid #d4e8e5;
  border-radius: 10px;
  /* 16px exacto: < 16px hace que iOS Safari haga zoom al enfocar el input,
     una mala primera impresión en móvil. */
  font-size: 16px;
  font-family: inherit;
  color: var(--fide-black);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.form-group input:focus {
  outline: none;
  border-color: var(--fide-teal);
  box-shadow: 0 0 0 4px rgba(0,167,157,0.12);
}
.btn-login {
  width: 100%;
  padding: 0.85rem;
  background: var(--fide-teal);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
  margin-top: 0.5rem;
}
.btn-login:hover { background: var(--fide-teal-dark); transform: translateY(-1px); }
.btn-login:active { transform: translateY(0); }
.btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.error-msg {
  /* Ámbar corporativo (NUNCA rojo — constraint corporativa) */
  color: #b8680f;
  background: #fcf0dd;
  border-left: 3px solid #c29200;
  padding: 0.5rem 0.7rem;
  border-radius: 4px;
  font-size: 0.82rem;
  font-weight: 700;
  margin-top: 0.8rem;
  min-height: 1.2em;
}
.error-msg:empty { display: none; }
.pwd-wrap { position: relative; }
.pwd-wrap input { padding-right: 44px; width: 100%; }
.pwd-eye { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #7a8a8d; cursor: pointer; padding: 6px; min-width: 36px; min-height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
.pwd-eye:hover, .pwd-eye:focus-visible { color: var(--fide-teal-dark); background: #e6f6f5; outline: none; }
.caps-hint { font-size: 0.8rem; color: #8a6400; min-height: 1.1em; margin-top: 4px; font-weight: 700; }
.remember { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: #5a6a6e; margin: 0.2rem 0 0.9rem; cursor: pointer; }
.remember input { width: 18px; height: 18px; accent-color: var(--fide-teal); }
.step2-txt { font-size: 0.95rem; color: #3b4a4d; line-height: 1.45; margin-bottom: 1rem; text-align: left; }
.link-btn { background: none; border: none; color: var(--fide-teal-dark); font: inherit; font-size: 0.9rem; font-weight: 700; cursor: pointer; padding: 6px 0; margin-bottom: 0.6rem; }
.link-btn:hover { text-decoration: underline; }
.footer {
  margin-top: 2rem;
  font-size: 0.75rem;
  color: #a0a8ab;
}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo-area">
    <img src="/static/fide-logo.png" alt="fide. Seguros" style="height:64px;width:auto;">
    <div class="subtitle">Panel de Gesti&oacute;n Integral</div>
  </div>
  <form id="loginForm">
    <div id="step1">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required placeholder="Tu usuario">
      </div>
      <div class="form-group">
        <label for="password">Contrase&ntilde;a</label>
        <div class="pwd-wrap">
          <input type="password" id="password" autocomplete="current-password" required placeholder="Tu contrase&ntilde;a">
          <button type="button" class="pwd-eye" id="pwdEye" aria-label="Mostrar contrase&ntilde;a" title="Mostrar contrase&ntilde;a">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="caps-hint" id="capsHint" aria-live="polite"></div>
      </div>
      <label class="remember"><input type="checkbox" id="rememberUser"> Recordar mi usuario en este equipo</label>
    </div>
    <div id="step2" style="display:none;">
      <p class="step2-txt">Tu cuenta tiene <strong>verificaci&oacute;n en dos pasos</strong>. Escribe el c&oacute;digo de 6 d&iacute;gitos de tu aplicaci&oacute;n autenticadora, o uno de tus c&oacute;digos de recuperaci&oacute;n.</p>
      <div class="form-group">
        <label for="totpCode">C&oacute;digo de verificaci&oacute;n</label>
        <input type="text" id="totpCode" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" maxlength="14" style="letter-spacing:3px;text-align:center;font-size:20px;">
      </div>
      <button type="button" class="link-btn" id="btnBack">&larr; Volver</button>
    </div>
    <button type="submit" class="btn-login" id="btnLogin">Iniciar Sesi&oacute;n</button>
    <div class="error-msg" id="errorMsg" role="alert" aria-live="assertive"></div>
  </form>
  <div class="footer">fide. Seguros &copy; 2026</div>
</div>

<script>
const $ = id => document.getElementById(id);
let pendingToken = null;

// Recordar usuario (solo el nombre de usuario, nunca la contraseña)
try {
  const last = localStorage.getItem('fide_last_user');
  if (last) { $('username').value = last; $('rememberUser').checked = true; setTimeout(() => $('password').focus(), 50); }
} catch (e) {}

// Mostrar / ocultar contraseña
$('pwdEye').addEventListener('click', () => {
  const p = $('password'); const show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  $('pwdEye').setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
  $('pwdEye').style.color = show ? '#007a73' : '';
  p.focus();
});
// Aviso de Bloq Mayús
$('password').addEventListener('keyup', (e) => {
  $('capsHint').textContent = (e.getModifierState && e.getModifierState('CapsLock')) ? 'Bloq Mayús está activado' : '';
});
$('btnBack').addEventListener('click', () => {
  pendingToken = null;
  $('step2').style.display = 'none'; $('step1').style.display = '';
  $('btnLogin').textContent = 'Iniciar Sesión'; $('errorMsg').textContent = '';
  $('password').value = ''; $('password').focus();
});

function entrar(data) {
  // La cookie ya quedó puesta por el servidor (HttpOnly, Secure, SameSite=Strict).
  // Solo guardamos nombre y rol para personalizar la interfaz.
  sessionStorage.setItem('fide_user', data.name || '');
  sessionStorage.setItem('fide_role', data.role || '');
  try {
    if ($('rememberUser').checked) localStorage.setItem('fide_last_user', $('username').value.trim());
    else localStorage.removeItem('fide_last_user');
  } catch (e) {}
  window.location.href = '/';
}

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('btnLogin'); const err = $('errorMsg');
  const esPaso2 = !!pendingToken;
  btn.disabled = true;
  btn.textContent = esPaso2 ? 'Verificando...' : 'Ingresando...';
  err.textContent = '';
  try {
    const url = esPaso2 ? '/api/auth/login/2fa' : '/api/auth/login';
    const body = esPaso2
      ? { pending_token: pendingToken, code: $('totpCode').value.trim() }
      : { username: $('username').value, password: $('password').value };
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                   credentials: 'same-origin', body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      err.textContent = data.detail || (res.status === 429 ? 'Demasiados intentos. Espera unos minutos.' : 'Credenciales inválidas');
      btn.disabled = false;
      btn.textContent = esPaso2 ? 'Verificar' : 'Iniciar Sesión';
      // Si el servidor canceló la verificación (5 códigos malos o expiró), volver al paso 1
      if (esPaso2 && res.status === 401 && /de nuevo|expirad/i.test(data.detail || '')) $('btnBack').click();
      return;
    }
    if (!esPaso2 && data.requires_totp) {
      pendingToken = data.pending_token;
      $('step1').style.display = 'none'; $('step2').style.display = '';
      btn.disabled = false; btn.textContent = 'Verificar';
      $('totpCode').value = ''; setTimeout(() => $('totpCode').focus(), 50);
      return;
    }
    entrar(data);
  } catch (e) {
    err.textContent = 'Error de conexión. Intenta de nuevo.';
    btn.disabled = false;
    btn.textContent = esPaso2 ? 'Verificar' : 'Iniciar Sesión';
  }
});
</script>
</body>
</html>
